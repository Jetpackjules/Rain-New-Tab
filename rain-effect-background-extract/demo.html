<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rain Background Extract</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05080a;
      }

      #rain-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .content {
        position: relative;
        z-index: 1;
        max-width: 680px;
        padding: 48px;
        color: white;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="rain-canvas"></canvas>
    <main class="content">
      <h1>Rain background</h1>
      <p>Replace this content with the site UI.</p>
    </main>
    <script type="module">
      import { startRainBackground } from "./src/background-rain.js";

      startRainBackground({
        canvas: document.getElementById("rain-canvas"),
        assetBase: "./assets/img",
      });
    </script>
  </body>
</html>
